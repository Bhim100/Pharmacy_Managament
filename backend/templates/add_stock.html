<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <style>
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95em;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>
    <div class="simple-page">
        <header class="simple-header">
            <div>
                <h1>Add New Stock</h1>
                <p class="section-copy">Register a new batch of medicine into the inventory.</p>
            </div>
            <a href="{{ url_for('inventory_page') }}">Back to Inventory</a>
        </header>

        <section class="info-panel" style="max-width: 800px; margin: 0 auto;">
            <div class="panel-head">
                <h3>Batch Details</h3>
            </div>
            <form method="post" action="{{ url_for('add_stock_page') }}" style="padding: 20px;">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="medicine_id">Medicine</label>
                        <select name="medicine_id" id="medicine_id" required>
                            <option value="">-- Select Medicine --</option>
                            {% for med in medicines %}
                            <option value="{{ med.medicine_id }}">{{ med.name }} {{ med.strength if med.strength else ''
                                }} ({{ med.generic_name }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="batch_no">Batch Number</label>
                        <input type="text" name="batch_no" id="batch_no" placeholder="Leave blank to auto-generate">
                    </div>

                    <div class="form-group">
                        <label for="quantity_in_stock">Quantity (Units)</label>
                        <input type="number" name="quantity_in_stock" id="quantity_in_stock" required min="1"
                            placeholder="e.g. 100">
                    </div>

                    <div class="form-group">
                        <label for="manufacturing_date">Manufacturing Date</label>
                        <input type="date" name="manufacturing_date" id="manufacturing_date" required>
                    </div>

                    <div class="form-group">
                        <label for="expiry_date">Expiry Date</label>
                        <input type="date" name="expiry_date" id="expiry_date" required>
                    </div>

                    <div class="form-group">
                        <label for="purchase_price">Purchase Price (Per Unit)</label>
                        <input type="number" name="purchase_price" id="purchase_price" step="0.01" required
                            placeholder="Rs.">
                    </div>

                    <div class="form-group">
                        <label for="selling_price">Selling Price (Per Unit)</label>
                        <input type="number" name="selling_price" id="selling_price" step="0.01" required
                            placeholder="Rs.">
                    </div>

                    <div class="form-group full-width">
                        <label for="rack_location">Rack Location (Optional)</label>
                        <input type="text" name="rack_location" id="rack_location" placeholder="e.g. A-12">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px;">
                    <a href="{{ url_for('inventory_page') }}" class="ghost-btn"
                        style="text-decoration: none;">Cancel</a>
                    <button type="submit" class="primary-btn">Save Batch</button>
                </div>
            </form>
        </section>
    </div>
</body>

</html>
